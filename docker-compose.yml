services:
  judge:
    build: .
    ports:
      - "3000:3000"
    environment:
      MAX_CONCURRENCY: "2"
    # The judge runs untrusted code: keep the container small and locked down.
    read_only: true
    tmpfs:
      - /tmp:size=512m,exec
      - /home/judge:size=64m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
